<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; display: none; }
        .download-btn { display: inline-block; padding: 10px 15px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-top: 10px; }
        img { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>TikTok Downloader</h2>
        <p>Masukkan link TikTok untuk mengunduh video (Tanpa Watermark):</p>
        
        <input type="url" id="tiktokUrl" placeholder="https://www.tiktok.com/@..." required>
        <button onclick="downloadTikTok()">Proses Video</button>

        <div id="loading" style="display:none; margin-top:15px;">Memproses video...</div>

        <div class="result" id="resultArea">
            <img id="coverImg" src="" alt="Thumbnail Video">
            <p id="videoTitle" style="font-size:14px; margin-top:8px;"></p>
            <a id="downloadBtn" class="download-btn" target="_blank" download>Download Video MP4</a>
        </div>
    </div>

    <script>
        async function downloadTikTok() {
            const url = document.getElementById('tiktokUrl').value;
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');

            if (!url) {
                alert("Masukkan URL TikTok terlebih dahulu!");
                return;
            }

            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                // Menggunakan API Gratisan dari TikWM
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const resData = await response.json();

                if (resData.code === 0) {
                    const data = resData.data;
                    document.getElementById('coverImg').src = data.cover;
                    document.getElementById('videoTitle').innerText = data.title;
                    
                    // Link download tanpa watermark
                    document.getElementById('downloadBtn').href = data.play; 

                    loading.style.display = 'none';
                    resultArea.style.display = 'block';
                } else {
                    alert("Gagal mengambil video. Pastikan link video TikTok valid/publik!");
                    loading.style.display = 'none';
                }
            } catch (error) {
                alert("Terjadi kesalahan sistem/koneksi.");
                loading.style.display = 'none';
            }
        }
    </script>

</body>
</html>
