<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video & MP3 Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            background-color: #000000;
        }

        /* Styling Live Video Wallpaper Pas di Layar HP */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            object-fit: contain;
            background-color: #000000;
            pointer-events: none;
        }

        /* Overlay gelap transparan halus */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 0;
            pointer-events: none;
        }

        /* Container Glassmorphism */
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 500px;
            text-align: center;
            z-index: 1;
        }

        h2 {
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .subtitle {
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 20px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #fe2c55;
            background: rgba(255, 255, 255, 1);
        }

        button {
            background-color: #fe2c55;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.4);
        }

        button:hover {
            background-color: #e02648;
        }

        #loading {
            display: none;
            margin: 15px 0;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .result {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .result img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .result h3 {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .download-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .download-buttons a {
            flex: 1;
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        .btn-video {
            background-color: #25f4ee;
            color: #000 !important;
        }

        .btn-audio {
            background-color: #000000;
        }

        .error {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<!-- Live Video Wallpaper -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="./walpaper.mp4" type="video/mp4">
</video>

<!-- Overlay -->
<div class="overlay"></div>

<div class="container">
    <h2>TikTok Downloader</h2>
    <p class="subtitle">Unduh Video (Tanpa Watermark) & Musik MP3</p>
    
    <div class="input-group">
        <input type="text" id="tiktokUrl" placeholder="Tempel URL Video TikTok di sini...">
        <button onclick="downloadTikTok()">Proses</button>
    </div>

    <div id="loading">Memproses, harap tunggu...</div>
    <div id="errorMessage" class="error"></div>

    <div class="result" id="resultContainer">
        <img id="authorImg" src="" alt="Avatar">
        <h3 id="videoTitle">Judul Video</h3>
        
        <div class="download-buttons">
            <a id="btnVideo" class="btn-video" href="#" target="_blank" download>Download MP4</a>
            <a id="btnAudio" class="btn-audio" href="#" target="_blank" download>Download MP3</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('bg-video');
        if (video) {
            video.muted = true;
            video.play().catch(error => {
                console.log("Autoplay ditahan browser:", error);
            });
        }
    });

    async function downloadTikTok() {
        const urlInput = document.getElementById('tiktokUrl').value.trim();
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const resultContainer = document.getElementById('resultContainer');

        errorMessage.innerText = '';
        resultContainer.style.display = 'none';

        if (!urlInput) {
            errorMessage.innerText = 'Harap masukkan URL TikTok yang valid!';
            return;
        }

        loading.style.display = 'block';

        try {
            const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
            const result = await response.json();

            loading.style.display = 'none';

            if (result.code === 0) {
                const data = result.data;

                document.getElementById('authorImg').src = data.author.avatar;
                document.getElementById('videoTitle').innerText = data.title || 'Video TikTok';
                
                document.getElementById('btnVideo').href = data.play;
                document.getElementById('btnAudio').href = data.music;

                resultContainer.style.display = 'block';
            } else {
                errorMessage.innerText = 'Gagal mengambil data. Pastikan URL benar dan video bersifat publik.';
            }
        } catch (error) {
            loading.style.display = 'none';
            errorMessage.innerText = 'Terjadi kesalahan sistem/jaringan. Coba lagi nanti.';
            console.error(error);
        }
    }
</script>

</body>
</html>
