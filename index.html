<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Video Terkunci</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background-color: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 80%;
      margin-bottom: 12px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .error-message {
      color: red;
      margin-top: 10px;
      display: none;
    }
    .video-container {
      display: none;
      margin-top: 20px;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* Rasio 16:9 */
      height: 0;
      overflow: hidden;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .link-list {
      text-align: left;
      margin-top: 20px;
    }
    .link-list a {
      color: #007bff;
      text-decoration: none;
      word-break: break-all;
    }
    .link-list a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form Kata Sandi -->
    <div id="login-box">
      <h2>Masukkan Kata Sandi</h2>
      <p>Halaman ini dilindungi. Masukkan kata sandi untuk melihat video.</p>
      <input type="password" id="passwordInput" placeholder="Masukkan password...">
      <br>
      <button onclick="checkPassword()">Buka Video</button>
      <p id="errorMsg" class="error-message">Kata sandi salah! Coba lagi.</p>
    </div>

    <!-- Konten Video (Disembunyikan secara default) -->
    <div id="content-box" class="video-container">
      <h2>Video 1</h2>
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/SReeJ9PlIHY" title="Video 1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <h2>Video 2</h2>
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/gQeZimKH85s" title="Video 2" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- Tautan Langsung -->
      <div class="link-list">
        <h3>Tautan Video:</h3>
        <ul>
          <li><a href="https://youtu.be/SReeJ9PlIHY?si=NUSB2ArvtLnnqiny" target="_blank">https://youtu.be/SReeJ9PlIHY?si=NUSB2ArvtLnnqiny</a></li>
          <li><a href="https://youtu.be/gQeZimKH85s?si=vtmSA3nNmrj3JrGC" target="_blank">https://youtu.be/gQeZimKH85s?si=vtmSA3nNmrj3JrGC</a></li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    function checkPassword() {
      const passwordInput = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('errorMsg');
      const loginBox = document.getElementById('login-box');
      const contentBox = document.getElementById('content-box');

      // Kata sandi yang ditentukan
      const correctPassword = "1234";

      if (passwordInput === correctPassword) {
        loginBox.style.display = 'none';
        contentBox.style.display = 'block';
      } else {
        errorMsg.style.display = 'block';
      }
    }
  </script>

</body>
</html>
