<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Video Latar Belakang */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            background-color: #111; /* Warna hitam saat video loading */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Kartu Konten Transparan */
        .box {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        h2 {
            font-size: 1.6rem;
            color: #111;
            margin-bottom: 8px;
        }

        p.desc {
            font-size: 0.88rem;
            color: #222;
            margin-bottom: 20px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            color: #111;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .result {
            margin-top: 20px;
            display: none;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin-top: 12px;
            font-weight: bold;
        }

        img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }

        .credit {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #111;
            font-weight: bold;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Tag Video dengan ID untuk dikontrol oleh JavaScript -->
    <video id="bgVideo" autoplay loop muted playsinline preload="auto">
        <source src="./__Live_Wallpaper_Cartethyia__F_1790072341254_HD.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <div class="box">
        <h2>TikTok Downloader</h2>
        <p class="desc">Tempelkan link video TikTok untuk mengunduh tanpa watermark:</p>
        
        <input type="url" id="tiktokUrl" placeholder="https://www.tiktok.com/@..." required>
        <button onclick="downloadTikTok()">Proses Video</button>

        <div id="loading" style="display:none; margin-top:15px; font-weight:bold; color:#0056b3;">
            Memproses video...
        </div>

        <div class="result" id="resultArea">
            <img id="coverImg" src="" alt="Thumbnail Video">
            <p id="videoTitle" style="font-size:13px; margin-top:8px; font-weight: 600; color: #111;"></p>
            <a id="downloadBtn" class="download-btn" target="_blank" download>Download Video MP4</a>
        </div>

        <div class="credit">by nevaria</div>
    </div>

    <script>
        // Memaksa video diputar saat halaman dibuka (Mengatasi pemblokiran browser HP)
        document.addEventListener("DOMContentLoaded", function() {
            const video = document.getElementById('bgVideo');
            video.play().catch(error => {
                console.log("Autoplay diblokir oleh browser, mencoba memutar ulang...", error);
            });
        });

        async function downloadTikTok() {
            const url = document.getElementById('tiktokUrl').value;
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');

            if (!url) {
                alert("Masukkan URL TikTok terlebih dahulu!");
                return;
            }

            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const resData = await response.json();

                if (resData.code === 0) {
                    const data = resData.data;
                    document.getElementById('coverImg').src = data.cover;
                    document.getElementById('videoTitle').innerText = data.title;
                    document.getElementById('downloadBtn').href = data.play; 

                    loading.style.display = 'none';
                    resultArea.style.display = 'block';
                } else {
                    alert("Gagal mengambil video. Pastikan link video TikTok valid/publik!");
                    loading.style.display = 'none';
                }
            } catch (error) {
                alert("Terjadi kesalahan sistem/koneksi.");
                loading.style.display = 'none';
            }
        }
    </script>

</body>
</html>
