<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NevSearch - Nonton Anime Gratis & Cari Anime</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background-color: #0d0d0f;
        }

        /* Video Live Wallpaper Background (Jelas tanpa blur) */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Overlay Tipis Transparan */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* Header Navigasi */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 30px;
            gap: 20px;
        }

        header a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        header a:hover {
            color: #ff4757;
        }

        /* Container Utama */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
            margin-top: -30px;
        }

        /* Logo NevSearch */
        .logo {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 1px;
            user-select: none;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        .logo span.nev {
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
        }

        .logo span.search {
            color: #ffffff;
        }

        /* Form & Search Box */
        .search-form {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 12px 20px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .search-box:hover, .search-box:focus-within {
            background: rgba(30, 30, 35, 0.95);
            border-color: #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }

        .search-box i {
            color: #bdc1c6;
            font-size: 18px;
            margin-right: 12px;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            width: 100%;
        }

        .search-box input::placeholder {
            color: #aaa;
        }

        /* Tombol Pencarian */
        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background: rgba(30, 30, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e8eaed;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            border-color: #ff4757;
            color: #ff4757;
            background: rgba(20, 20, 25, 0.95);
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.4);
        }

        /* Quick Links / Tag Anime */
        .quick-tags {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tag {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #8ab4f8;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            cursor: pointer;
        }

        .tag:hover {
            background-color: #ff4757;
            color: #fff;
            border-color: #ff4757;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        /* Footer */
        footer {
            background: rgba(10, 10, 12, 0.9);
            color: #aaa;
            font-size: 13px;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        footer a {
            color: #aaa;
            text-decoration: none;
            margin-left: 15px;
            transition: 0.3s;
        }

        footer a:hover {
            color: #fff;
        }

        /* Responsif untuk HP */
        @media (max-width: 600px) {
            .logo { font-size: 48px; }
            .buttons { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
            footer { flex-direction: column; gap: 10px; text-align: center; }
            footer a { margin: 0 5px; }
        }
    </style>
</head>
<body>

    <video class="video-bg" autoplay loop muted playsinline>
        <source src="walpaper.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <div class="video-overlay"></div>

    <header>
        <a href="https://www.bilibili.tv/id/index" target="_blank"><i class="fa-solid fa-play"></i> Streaming BStation</a>
        <a href="https://myanimelist.net/topanime.php" target="_blank">Top Anime</a>
        <a href="https://myanimelist.net/anime/season" target="_blank">Musim Ini</a>
    </header>

    <div class="main-container">
        <div class="logo">
            <span class="nev">Nev</span><span class="search">Search</span>
        </div>

        <form class="search-form" id="searchForm">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari anime untuk ditonton gratis..." required autocomplete="off">
            </div>

            <div class="buttons">
                <button type="submit" class="btn"><i class="fa-solid fa-play"></i> Tonton Gratis</button>
                <button type="button" class="btn" id="infoBtn"><i class="fa-solid fa-circle-info"></i> Info MAL</button>
            </div>
        </form>

        <div class="quick-tags">
            <a onclick="quickWatch('Solo Leveling')" class="tag">#Solo Leveling</a>
            <a onclick="quickWatch('One Piece')" class="tag">#One Piece</a>
            <a onclick="quickWatch('Jujutsu Kaisen')" class="tag">#Jujutsu Kaisen</a>
            <a onclick="quickWatch('Demon Slayer')" class="tag">#Demon Slayer</a>
            <a onclick="quickWatch('Naruto')" class="tag">#Naruto</a>
        </div>
    </div>

    <footer>
        <div>&copy; 2026 NevSearch - Penelusuran & Streaming Anime Gratis</div>
        <div>
            <a href="https://www.bilibili.tv" target="_blank">Bilibili</a>
            <a href="https://myanimelist.net" target="_blank">MyAnimeList</a>
        </div>
    </footer>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const infoBtn = document.getElementById('infoBtn');

        // Fungsi Tonton Gratis (Mencari langsung video streaming anime di Bilibili/Bstation)
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                window.open(`https://www.bilibili.tv/id/search-result?q=${encodeURIComponent(query)}`, '_blank');
            }
        });

        // Tombol Info (Mencari detail/informasi di MyAnimeList)
        infoBtn.addEventListener('click', function() {
            const query = searchInput.value.trim();
            if (query) {
                window.open(`https://myanimelist.net/anime.php?q=${encodeURIComponent(query)}`, '_blank');
            } else {
                window.open('https://myanimelist.net/anime/season', '_blank');
            }
        });

        // Tag Cepat untuk Langsung Nonton Gratis
        function quickWatch(title) {
            searchInput.value = title;
            window.open(`https://www.bilibili.tv/id/search-result?q=${encodeURIComponent(title)}`, '_blank');
        }
    </script>
</body>
</html>
